DIRECTION CONTRACT (get-me-there, the departure board)

OWN-WORLD: Brushed-steel ground; matte black flap boards in bolted steel frames; white Barlow Condensed caps in fixed cells; amber lamps for not checked or stale, dim red for failed; white enamel plates in Atkinson Hyperlegible Next for forms and long reading; months as a lamp matrix.
STORY: The operator reads the cheapest date pair, its source, age and how far it was checked in one row, sees what was not searched, then lets the board flip or presses Update board.
FIRST VIEWPORT: Steel nav strip and status line; search name in large flaps; run age and coverage line; the board full width, column names painted on its frame. On a phone: one nav row, the status folded to its summary, the board inside 375 x 812.
