name: mutation
# Ruling 10 (plan decision 67): the Stryker gate on core's hard-rule predicates (spec §9, break 80%), the engine's
# catch-up, browser-window and heartbeat rules (WP16a) and the worker's safety modules runs sandboxed,
# fails when timed-out mutants exceed 5% of those tested, and runs on demand and weekly in a job of its own, never on
# every push, so its load never shares a runner with another suite.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
# Actions are pinned by commit SHA (plan decision 63), the same SHAs ci.yml reads.
jobs:
  mutate:
    # why: ubuntu-latest moves to a new image without notice; a pinned image changes only when this line does.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-mutation-globs.mjs
      - run: pnpm mutate
