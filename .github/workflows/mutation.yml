name: mutation
# Ruling 10 (plan decision 67): the Stryker gate on core's hard-rule predicates (spec §9, break 80%) runs sandboxed,
# fails when timed-out mutants exceed 5% of those tested, and runs on demand and weekly in a job of its own, never on
# every push, so its load never shares a runner with another suite.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
# Actions are pinned by commit SHA (plan decision 63), the same SHAs ci.yml reads.
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutate
