name: ci
on:
  push:
    branches: [main, 'wp/**']
  pull_request: {}
permissions:
  contents: read
# Actions are pinned by commit SHA (plan decision 63); the comment names the tag the SHA was read from on 2026-10-17.
jobs:
  test:
    # why: ubuntu-latest moves to a new image without notice; a pinned image changes only when this line does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm casts
      - run: pnpm -r typecheck
      # why: the root vitest config ignores each package's coverage thresholds (coverage is a root-only option), so every
      # package runs its own `test` script (its config, its thresholds, then its TZ runs); the root scripts project follows.
      - run: pnpm -r --workspace-concurrency=1 test
      - run: pnpm exec vitest run --project scripts
      # why: recorded vendor responses are local-only (plan decisions 61, 64), so this fresh checkout has none. Every suite
      # that replays them must report its skip by title, never pass vacuously; `shell: bash` adds -o pipefail, so a
      # failing suite fails the step even through tee.
      - name: recording-dependent suites skip visibly (decision 61)
        shell: bash
        run: |
          pnpm exec vitest run --project api --project providers --project engine test/recorded/ test/searchapi/recorded.test.ts test/travelpayouts/replay.test.ts test/layerB/ --reporter=verbose | tee recorded-skip.log
          # why: WP14: the camoufox worker's recorded pages are local-only too (decision 61)
          pnpm exec vitest run --project camoufox-worker test/recorded.test.ts test/names.test.ts --reporter=verbose | tee -a recorded-skip.log
          suffix='(skipped: recordings not present, local-only, decision 61)'
          for title in \
            'local recorded tree for the worked example' \
            'recorded Travelpayouts fixtures (WP4b) replay through replayHandlers (plan decision 17: one session)' \
            'WP4b recordings this brief relies on (§7 "Inputs from WP4b") — pending-fixtures' \
            'SEARCHAPI_PARAMS against the recording (spec §5.2, plan decision 24) — pending-fixtures' \
            'recorded replay through the adapter (spec §5.2, §5.4, §9 item 2) — pending-fixtures' \
            'layer B: the engine over the real adapters on the recorded session (spec §9 item 4)' \
            'recorded results pages (spec §2, Task 14.2)' \
            'recorded cheapest pages (spec §2, Task 14.2)' \
            'recorded view-more pages (spec §2, Task 14.2)' \
            'recorded SOCS stability (ruling 9)' \
            'recorded consent probe (rule 3)' \
            'recorded no-flights page (rule 4)' \
            'recorded result names parse (Task 14.2 results kind)' \
            'recorded operated-by names parse (Task 14.2 view-more kind)'; do
            grep -qF "$title $suffix" recorded-skip.log || { echo "not skipped visibly: $title"; exit 1; }
          done
      - run: pnpm secret-scan
      - name: secret scan catches a planted fixture
        run: |
          mkdir -p packages/providers/fixtures/recorded/planted
          echo '{"url":"https://x/?api_key=ABCDEFGH12345678"}' > packages/providers/fixtures/recorded/planted/p.json
          if pnpm secret-scan; then echo "scan missed the plant"; exit 1; fi
          rm -r packages/providers/fixtures/recorded/planted
  docker:
    # Spec §13 through the shipped docker-compose.yml: the image builds from the lockfile, runs as node with the
    # production flags, no curl and no secret or recording inside; compose boots it healthy on a fresh volume; it backs
    # itself up as node; a second app is refused (decision 53); a graceful stop exits 0 and releases the lock; after a
    # hard kill the restarted app takes the stale lock over (decision 63); a backup restores by the documented steps.
    # why: ubuntu-latest moves to a new image without notice; a pinned image changes only when this line does.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: the image-size step builds origin/main beside this one
          fetch-depth: 0
      - name: Compose file is valid
        run: docker compose --env-file /dev/null config --quiet
      - name: Build the image through compose
        run: docker compose --env-file /dev/null build app
      - name: Image runs as node with the production flags and carries no curl or wget
        run: |
          test "$(docker run --rm --entrypoint id get-me-there:local -u)" = "1000"
          docker run --rm --entrypoint node get-me-there:local -e "process.exit(process.env.NODE_ENV === 'production' && process.env.IN_CONTAINER === '1' ? 0 : 1)"
          if docker run --rm --entrypoint sh get-me-there:local -c 'command -v curl || command -v wget'; then exit 1; fi
      - name: Image carries no camoufox worker, no browser library and no browser (WP14, arch-002)
        run: |
          # why: a glob, since pnpm suffixes peer-resolved directories (camoufox-js@0.11.5_playwright-core@…; TS2-11)
          docker run --rm --entrypoint sh get-me-there:local -c '! test -e /app/apps/camoufox-worker && ! ls -d /app/node_modules/.pnpm/camoufox-js@* /app/node_modules/.pnpm/playwright-core@* 2>/dev/null && ! command -v firefox'
      - name: Image size stays within 5 MB of main's (WP14, arch-002)
        run: |
          # why: the worker and its browser libraries never reach the image, so its size must not move with them
          git worktree add ../gmt-main origin/main
          docker build -q -t get-me-there:main ../gmt-main > /dev/null
          new="$(docker image inspect get-me-there:local --format '{{.Size}}')"
          old="$(docker image inspect get-me-there:main --format '{{.Size}}')"
          echo "image size: $new bytes (main: $old bytes)"
          test $(( new - old )) -le 5000000
      - name: Image holds no secret, database or recording, and its history no credential
        run: |
          found="$(docker run --rm --entrypoint sh get-me-there:local -c \
            'find / -xdev -path /app/node_modules/.pnpm -prune -o \( -name ".env" -o -name ".env.*" -o -name "*.db" -o -name "*.pem" -o -name "*.key" -o -path "*/fixtures/recorded*" \) -print 2>/dev/null; true')"
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
          # why: a credential in any shape a layer can hold: NAME=value, NAME: value or "name": value, and an ENV layer's
          # space form (ENV NAME value), the whole name matched so a suffixed one (SECRET_KEY_BASE) counts too
          # (CodeRabbit batch 3, PR #3 review)
          # why: grep counts, never prints: a real hit must not write the credential into a public CI log (PR #3 re-review)
          n="$(docker history --no-trunc get-me-there:local | grep -Eic -e '(token|key|pass(wd|word)?|secret|auth|bearer|credential)[a-z0-9_]*"?[[:space:]]*[=:]' -e 'ENV[[:space:]]+[a-z0-9_]*(token|key|pass|secret|auth|bearer|credential)[a-z0-9_]*[[:space:]]+[^[:space:]]')" || true; if [ "${n:-0}" -gt 0 ]; then echo "image history: $n credential-like line(s) found; not shown" >&2; exit 1; fi
      - name: Compose boots it healthy with the documented three-line .env
        run: |
          # why: CI-only throwaway values that must never match a real credential; the token is a dummy and boot makes no
          # vendor call, and the file is written here, never printed or archived
          printf 'TRAVELPAYOUTS_TOKEN=ci-dummy-token-0123456789\nAPP_BASIC_AUTH_USER=ci\nAPP_BASIC_AUTH_PASS=ci-password-0123\n' > .env
          chmod 600 .env
          docker compose up -d --wait --wait-timeout 300 || { docker compose logs app; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/health
          test "$(docker compose exec -T app id -un)" = node
          test -z "$(docker compose ps --services --status running | grep -v '^app$')"
      - name: The container refuses the recording tool (decision 62)
        run: |
          code="$(curl -sS -o refusal.json -w '%{http_code}' -u ci:ci-password-0123 -H 'Content-Type: application/json' -H 'X-Requested-With: get-me-there' -X POST --data '{"budget":1,"origins":["LHR"],"destinations":["JFK"],"month":"2027-03"}' http://127.0.0.1:3000/api/tools/record)"
          test "$code" = 409
          grep -F recording_in_container refusal.json
          rm -f refusal.json
      - name: Backup runs inside the container as node, into a private /data/backups
        run: |
          docker compose exec -T app node scripts/backup.mjs | tee backup.json
          test "$(docker compose exec -T app stat -c '%u %a' /data/backups)" = "1000 700"
      - name: A second app on the same volume refuses with 75 (decision 53)
        run: |
          set +e
          docker compose run --rm --no-deps -T app
          code=$?
          set -e
          test "$code" = 75
      - name: A graceful stop exits 0 within the grace period and releases the lock (decision 63)
        run: |
          start=$(date +%s)
          docker compose stop app
          test $(( $(date +%s) - start )) -lt 30
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")" = 0
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose up -d --wait --wait-timeout 120
          if docker compose logs --since "$since" app | grep -F 'waiting for app_lock'; then exit 1; fi
      - name: After a hard kill the restarted app takes the stale lock over (decision 63)
        run: |
          docker compose kill -s KILL app
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose up -d --wait --wait-timeout 300 || { docker compose logs app; exit 1; }
          docker compose logs --since "$since" app | grep -F 'waiting for app_lock'
          docker compose logs --since "$since" app | grep -F 'taking over a stale app_lock'
      - name: A backup restores by the documented steps (docs/setup.md section 6)
        run: |
          file="$(node -p "JSON.parse(require('fs').readFileSync('backup.json','utf8')).file")"
          mkdir -m 0700 ci-backups
          docker compose cp "app:$file" ci-backups/
          docker compose stop app
          docker compose run --rm --no-deps -T --entrypoint sh app -c 'cat > /data/restore.db' < "ci-backups/$(basename "$file")"
          docker compose run --rm --no-deps -T --entrypoint node app scripts/check-backup.mjs /data/restore.db
          docker compose run --rm --no-deps -T --entrypoint sh app -c 'cd /data &&
            for f in get-me-there.db get-me-there.db-wal get-me-there.db-shm; do
              if [ -e "$f" ]; then mv "$f" "$f.pre-restore"; fi
            done && mv restore.db get-me-there.db'
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:3000/api/health
          docker compose exec -T app sh -c 'test -e /data/get-me-there.db.pre-restore'
      - name: app runs with the camoufox-worker absent (WP14, devops-012)
        shell: bash
        run: |
          # why: the default project's app holds the published port; its checks are done, and cleanup removes it
          docker compose stop app
          # why: a separate project with its own volume; the dummy 32-character key comes through the shell, never .env
          export CAMOUFOX_ENABLED=true CAMOUFOX_WORKER_KEY=ci-dummy-camoufox-key-0123456789abcd
          trap 'docker compose -p gmt-cfabsent down -v || true' EXIT
          docker compose -p gmt-cfabsent up -d --wait --wait-timeout 300 || { docker compose -p gmt-cfabsent logs app; exit 1; }
          base=http://127.0.0.1:3000/api
          auth=(-u ci:ci-password-0123 -H 'Content-Type: application/json' -H 'X-Requested-With: get-me-there')
          curl -fsS "$base/health"
          curl -fsS "${auth[@]}" "$base/providers" | grep -F '"camoufox"'
          # a one-cell definition naming camoufox only, from the worked example 40 days out
          body="$(node -e 'const e=require("./docs/examples/london-new-york.json");const d=new Date(Date.now()+40*864e5).toISOString().slice(0,10);Object.assign(e,{name:"camoufox absent",origins:["LHR"],destinations:["JFK"],window:{kind:"absolute",from:d,to:d},minNights:10,maxNights:10,scheduleCron:null,providers:{discovery:["camoufox"],verification:[],discoveryRefreshHours:{camoufox:168}}});delete e.confirmedCostPence;delete e.confirmedCalls;process.stdout.write(JSON.stringify(e))')"
          def="$(curl -fsS "${auth[@]}" -X POST --data "$body" "$base/definitions" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')"
          exe="$(curl -fsS "${auth[@]}" -X POST --data '{}' "$base/definitions/$def/executions" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).executionId')"
          status=pending
          for _ in $(seq 1 60); do
            status="$(curl -fsS "${auth[@]}" "$base/executions/$exe" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).status')"
            case "$status" in pending|running) sleep 2 ;; *) break ;; esac
          done
          echo "execution $exe ended $status"
          # the camoufox cells were skipped by the preflight, and no camoufox ledger row exists
          check='const D=require(require.resolve("better-sqlite3",{paths:["/app/packages/db"]}));const d=new D("/data/get-me-there.db",{readonly:true});const o=d.prepare("SELECT status, reason FROM cell_outcomes WHERE provider_id = ?").all("camoufox");const r=d.prepare("SELECT COUNT(*) AS n FROM provider_requests WHERE provider_id = ?").get("camoufox").n;console.log(JSON.stringify({o,r}));process.exit(o.length>0&&o.every((x)=>x.status==="skipped"&&x.reason==="provider_unavailable")&&r===0?0:1)'
          docker compose -p gmt-cfabsent exec -T app node -e "$check"
      - name: Remove the CI container and its throwaway volume
        if: always()
        run: |
          docker compose logs app | tail -n 50 || true
          # why: CI's volume only; docs/setup.md forbids `down -v` on a real host
          docker compose down -v || true
          rm -f .env backup.json refusal.json
