name: e2e
# Spec §9 item 6 and §17 revision 50 (settled by the orchestrator): the Playwright suite in fixture mode, through the
# real api and the built SPA: the smoke on the desktop and 375 px projects, and the performance test (`@perf`, desktop
# only). Each browser time limit (1.5 s to draw, 200 ms to redraw, no task over 200 ms) is multiplied by
# GMT_TIMING_FACTOR, 3 here, because a shared runner is slower and noisier than the operator's machine and a limit
# that fails on noise teaches nothing; the operator's own run uses factor 1. It loads no vendor page, calls no vendor
# (the fixture provider is synthetic) and reads no secret.
# why: a workflow of its own, because a path filter applies to a whole workflow and the test matrix must run on every push
on:
  push:
    branches: [main, 'wp/**']
    paths:
      - apps/web/**
      - apps/api/**
      - packages/core/**
      - packages/db/**
      - packages/engine/**
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - apps/web/**
      - apps/api/**
      - packages/core/**
      - packages/db/**
      - packages/engine/**
      - .github/workflows/e2e.yml
permissions:
  contents: read
# Actions are pinned by commit SHA (plan decision 63), the same SHAs ci.yml reads.
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GMT_TIMING_FACTOR: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install Chromium for Playwright
        run: pnpm --filter @gmt/web e2e:install
      # why: the e2e script builds every package first, then runs both Playwright projects (the smoke and @perf)
      - name: the smoke and the performance test
        run: pnpm --filter @gmt/web e2e
